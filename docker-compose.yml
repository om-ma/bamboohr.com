services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      RAILS_ENV: development
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    stdin_open: true
    tty: true

volumes:
  bundle_cache:
